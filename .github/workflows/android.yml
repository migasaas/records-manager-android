name: Android CI 

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.16-8/x64

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable and verify wrapper files
        run: |
          set -e
          echo "CWD: $(pwd)"
          echo "Listing repo root:"
          ls -la
          echo "Listing gradle/ and gradle/wrapper/ (if present):"
          ls -la gradle || true
          ls -la gradle/wrapper || true

          # ensure wrapper script and jar exist
          test -f gradlew || (echo "ERROR: gradlew script missing" && exit 1)
          test -f gradle/wrapper/gradle-wrapper.jar || (echo "ERROR: gradle-wrapper.jar missing" && exit 1)

          # make executable
          chmod +x ./gradlew || true

          echo "--- gradlew head ---"
          head -n 40 gradlew || true

          echo "--- gradle-wrapper.jar info ---"
          stat -c '%n %s %F' gradle/wrapper/gradle-wrapper.jar || true
          file gradle/wrapper/gradle-wrapper.jar || true

      - name: Print Gradle wrapper version
        run: ./gradlew --version

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace
